name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build into a draft, for example v2.0.0
        required: true
        type: string
      publish_release:
        description: Publish the release after all assets are uploaded
        required: true
        default: false
        type: boolean
      reuse_existing_draft_assets:
        description: Promote an existing validated draft without rebuilding platform installers
        required: true
        default: false
        type: boolean

      prepared_run_id: { type: string, description: Full220 prepared stage run ID }
      prepared_run_attempt: { type: string, description: Full220 prepared stage run attempt }
      prepared_artifact_id: { type: string, description: Full220 prepared stage artifact ID }
      prepared_artifact_sha256:
        { type: string, description: Full220 prepared stage whole ZIP SHA256 }
      plan_digest: { type: string, description: Full220 prepared plan SHA256 }
      native_receipt_json: { type: string, description: Full220 complete native readiness receipt }

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  IS_RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  PUBLISH_RELEASE: ${{ inputs.publish_release }}

jobs:
  release-custody:
    name: Validate release source before release builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Reject untrusted new-build dispatch
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REUSE_EXISTING_DRAFT: ${{ inputs.reuse_existing_draft_assets }}
        run: |
          set -euo pipefail
          if [ "$REUSE_EXISTING_DRAFT" = true ]; then
            exit 0
          fi
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = "$REPOSITORY_OWNER"
          test "$TRIGGERING_ACTOR" = "$REPOSITORY_OWNER"

      - name: Checkout release source
        if: ${{ !inputs.reuse_existing_draft_assets }}
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require selected release tag to match workflow commit
        if: ${{ !inputs.reuse_existing_draft_assets }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$GITHUB_SHA"

  build:
    needs: release-custody
    if: ${{ !inputs.reuse_existing_draft_assets }}
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Restore pnpm node-gyp executable bit
        shell: bash
        run: |
          PNPM_STORE="$(pnpm store path)"
          PNPM_BIN_DIR="$(dirname "$(command -v pnpm)")"
          for path in "$PNPM_STORE" "${PNPM_HOME:-}" "$PNPM_BIN_DIR"; do
            if [ -d "$path" ]; then
              find "$path" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \; 2>/dev/null || true
            fi
          done

      - name: Install dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs

      - name: Validate release metadata
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        run: |
          set -euo pipefail
          case "${RELEASE_TAG:-}" in
            v[0-9]*) ;;
            *)
              echo "release_tag must start with v and include a numeric version, got '${RELEASE_TAG:-<empty>}'" >&2
              exit 1
              ;;
          esac

      - name: Set version from release tag
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          pnpm pkg set version="$VERSION"

      - name: Verify Sentry release env
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node ./scripts/ci/verify-sentry-release.cjs prebuild

      - name: Verify PostHog release env
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: node ./scripts/ci/verify-posthog-release.cjs prebuild

      - name: Build app
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          SENTRY_DSN: ${{ github.event_name == 'workflow_dispatch' && secrets.SENTRY_DSN || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          POSTHOG_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.POSTHOG_KEY || '' }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: pnpm build

      - name: Verify Sentry source map upload
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node ./scripts/ci/verify-sentry-release.cjs postbuild

      - name: Verify PostHog renderer bundle
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: node ./scripts/ci/verify-posthog-release.cjs postbuild


      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            out/renderer
            dist-electron
          retention-days: 1

  prepare-runtime:
    needs: release-custody
    if: ${{ !inputs.reuse_existing_draft_assets }}
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release metadata
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        run: |
          set -euo pipefail
          case "${RELEASE_TAG:-}" in
            v[0-9]*) ;;
            *)
              echo "release_tag must start with v and include a numeric version, got '${RELEASE_TAG:-<empty>}'" >&2
              exit 1
              ;;
          esac

      - name: Skip runtime asset preparation for non-release builds
        if: ${{ env.IS_RELEASE_BUILD != 'true' }}
        run: echo "Runtime asset preparation is only needed for release builds."

      - name: Check runtime assets
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          node ./scripts/ci/verify-runtime-lock.mjs
          RELEASE_KIND="$(node -p "require('./runtime.lock.json').releaseKind")"
          if [ "$RELEASE_KIND" != 'windows-x64-claude-only' ]; then
            echo "Expected the fork's Windows x64 runtime lock, got '${RELEASE_KIND:-<empty>}'." >&2
            exit 1
          fi
          SOURCE_REPO="$(node ./scripts/runtime-lock.mjs source-repository)"
          RELEASE_REPO="$(node ./scripts/runtime-lock.mjs release-repository)"
          if [ "$SOURCE_REPO" != 'stgmt/agent_teams_orchestrator' ] || [ "$RELEASE_REPO" != 'stgmt/agent_teams_orchestrator' ]; then
            echo "Runtime source and release must both be stgmt/agent_teams_orchestrator." >&2
            exit 1
          fi
          RELEASE_TAG="$(node ./scripts/runtime-lock.mjs release-tag)"
          existing="$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          assets="$(node ./scripts/runtime-lock.mjs asset-list)"
          missing=0
          asset_count=0
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            asset_count=$((asset_count + 1))
            if ! grep -Fqx "$asset" <<<"$existing"; then
              echo "Missing fork runtime asset: $asset"
              missing=1
            fi
          done <<< "$assets"
          if [ "$asset_count" -ne 1 ] || [ "$missing" = 1 ]; then
            echo "The exact fork Windows x64 runtime asset is unavailable; refusing to continue." >&2
            exit 1
          fi

      - name: Create GitHub Release
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          existing_is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ -n "$existing_is_draft" ]; then
            if [ "${PUBLISH_RELEASE}" != "true" ] && [ "$existing_is_draft" != "true" ]; then
              echo "Release $TAG already exists and is not a draft; refusing to overwrite it from draft mode." >&2
              exit 1
            fi
            echo "Release $TAG already exists, skipping creation"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --draft=true

  prepare-terminal-platform-runtime:
    needs: release-custody
    if: ${{ !inputs.reuse_existing_draft_assets }}
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Skip terminal-platform asset preparation for non-release builds
        if: ${{ env.IS_RELEASE_BUILD != 'true' }}
        run: echo "Terminal-platform asset preparation is only needed for release builds."

      - name: Check Windows x64 terminal-platform release assets
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_REPO="$(node ./scripts/terminal-platform-lock.mjs release-repository)"
          RELEASE_TAG="$(node ./scripts/terminal-platform-lock.mjs release-tag)"
          RUNTIME_VERSION="$(node ./scripts/terminal-platform-lock.mjs version)"
          RUNTIME_ASSET="$(node ./scripts/terminal-platform-lock.mjs asset-name win32-x64)"
          MANIFEST_ASSET="terminal-platform-runtime-manifest-v${RUNTIME_VERSION}.json"
          existing="$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          for release_file in "$RUNTIME_ASSET" "$MANIFEST_ASSET"; do
            if ! grep -Fqx "$release_file" <<<"$existing"; then
              echo "Missing pinned Windows x64 terminal-platform release file: $release_file" >&2
              exit 1
            fi
          done



  verify-public-runtime:
    name: verify runtime (${{ matrix.platform }})
    needs: prepare-runtime
    if: ${{ always() && (needs.prepare-runtime.result == 'success' || (inputs.publish_release && inputs.reuse_existing_draft_assets)) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require the selected release tag to match the workflow commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Verify runtime lock pins on the release ref
        run: node ./scripts/ci/verify-runtime-lock.mjs

      - name: Verify draft runtime archive before packaging
        if: ${{ !inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
        run: |
          node ./scripts/stage-runtime.mjs --platform ${{ matrix.platform }}
          node ./scripts/ci/verify-staged-runtime-version.mjs

      - name: Verify anonymous runtime bootstrap before packaging
        if: ${{ inputs.publish_release }}
        run: node ./scripts/ci/verify-public-runtime-bootstrap.mjs


  release-win:
    needs: [build, prepare-runtime, prepare-terminal-platform-runtime, verify-public-runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            runtime_platform: win32-x64
            bundle_directory: win-unpacked
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore pnpm node-gyp executable bit
        shell: bash
        run: |
          PNPM_STORE="$(pnpm store path)"
          PNPM_BIN_DIR="$(dirname "$(command -v pnpm)")"
          for path in "$PNPM_STORE" "${PNPM_HOME:-}" "$PNPM_BIN_DIR"; do
            if [ -d "$path" ]; then
              find "$path" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \; 2>/dev/null || true
            fi
          done

      - name: Install dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs

      - name: Set version from release tag
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          pnpm pkg set version="$VERSION"

      - name: Stage bundled runtime (Windows ${{ matrix.arch }})
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
        run: node ./scripts/stage-runtime.mjs --platform ${{ matrix.runtime_platform }}

      - name: Stage terminal-platform runtime (Windows ${{ matrix.arch }})
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/stage-terminal-platform-runtime.mjs --platform ${{ matrix.runtime_platform }}

      - name: Verify Sentry release env (Windows)
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node ./scripts/ci/verify-sentry-release.cjs prebuild

      - name: Verify PostHog release env (Windows)
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: node ./scripts/ci/verify-posthog-release.cjs prebuild

      - name: Build app (Windows)
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          SENTRY_DSN: ${{ github.event_name == 'workflow_dispatch' && secrets.SENTRY_DSN || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          POSTHOG_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.POSTHOG_KEY || '' }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: pnpm build

      - name: Verify Sentry source map upload (Windows)
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node ./scripts/ci/verify-sentry-release.cjs postbuild

      - name: Verify PostHog renderer bundle (Windows)
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: node ./scripts/ci/verify-posthog-release.cjs postbuild


      - name: Verify packaged inputs (Windows)
        shell: bash
        run: |
          test -f dist-electron/main/index.cjs
          test -f dist-electron/preload/index.js
          test -f out/renderer/index.html
          test -f mcp-server/dist/index.js
          test -f resources/runtime/VERSION
          test -f resources/terminal-platform/VERSION
          test -f resources/terminal-platform/terminal-daemon.exe
          test -f resources/terminal-platform/terminal-platform-node/index.mjs

      - name: Package (Windows ${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm pack:win:${{ matrix.arch }} --publish never

      - name: Validate packaged bundle (Windows ${{ matrix.arch }})
        shell: bash
        run: node ./scripts/electron-builder/verifyBundle.cjs "release/${{ matrix.bundle_directory }}" win32 ${{ matrix.arch }}

      - name: Smoke packaged app (Windows ${{ matrix.arch }})
        shell: bash
        run: node ./scripts/electron-builder/smokePackagedApp.cjs "release/${{ matrix.bundle_directory }}" win32

      - name: Upload assets to release
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG}"
          for f in release/*.exe release/*.blockmap; do
            [ -f "$f" ] || continue
            echo "Uploading: $f"
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber 2>&1 || \
              (sleep 5 && gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber 2>&1)
          done


  upload-stable-links:
    needs: [release-win]
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && !inputs.reuse_existing_draft_assets }}

    steps:
      - name: Checkout release promotion
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Require prepared full220 publication
        if: ${{ inputs.release_tag == 'v2.17.7' || inputs.release_tag == 'v2.17.8' || inputs.release_tag == 'v2.17.9' || inputs.release_tag == 'v2.17.10' }}
        run: |
          echo 'Full220 must be staged and qualified before publication; use reuse_existing_draft_assets=true' >&2
          exit 1

      - name: Promote validated release assets
        if: ${{ inputs.release_tag != 'v2.17.7' && inputs.release_tag != 'v2.17.8' && inputs.release_tag != 'v2.17.9' && inputs.release_tag != 'v2.17.10' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          PUBLISH_RELEASE: 'true'
          ALLOW_PUBLISHED_RELEASE_RECOVERY: 'true'
          REDRAFT_INCOMPLETE_RELEASE: 'true'
        run: node scripts/ci/promote-existing-draft.mjs

  promote-existing-draft:
    permissions:
      contents: write
      actions: read
    needs: verify-public-runtime
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 30
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.reuse_existing_draft_assets && needs.verify-public-runtime.result == 'success' }}

    steps:
      - name: Checkout release promotion
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Require publication mode
        if: ${{ !inputs.publish_release }}
        run: |
          echo "reuse_existing_draft_assets requires publish_release=true" >&2
          exit 1

      - name: Preserve unpublished217,218 and219 tags
        if: ${{ inputs.publish_release && (inputs.release_tag == 'v2.17.7' || inputs.release_tag == 'v2.17.8' || inputs.release_tag == 'v2.17.9') }}
        run: |
          echo 'v2.17.7, v2.17.8 and v2.17.9 are frozen unpublished; publish v2.17.10 instead' >&2
          exit 1

      - name: Publish byte-preserved prepared full220 after native readiness
        if: ${{ inputs.publish_release && inputs.release_tag == 'v2.17.10' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          PREPARED_ARTIFACT_SHA256: ${{ inputs.prepared_artifact_sha256 }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          NATIVE_RECEIPT_JSON: ${{ inputs.native_receipt_json }}
        run: pnpm exec tsx scripts/ci/publish-full-release.ts --plan-digest "$PLAN_DIGEST" --output publication-result.json --publish

      - name: Promote existing validated draft
        if: ${{ inputs.publish_release && inputs.release_tag != 'v2.17.7' && inputs.release_tag != 'v2.17.8' && inputs.release_tag != 'v2.17.9' && inputs.release_tag != 'v2.17.10' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          PUBLISH_RELEASE: 'true'
          REDRAFT_INCOMPLETE_RELEASE: 'true'
        run: node scripts/ci/promote-existing-draft.mjs
